name: Generate and Send Video to Buffer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'  # 11:00 UTC (13:00 CEST)
    - cron: '0 17 * * *'  # 17:00 UTC (19:00 CEST)

permissions:
  contents: write

jobs:
  post_video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run video poster script
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python generate_and_send_video.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_posts.csv
          if git diff --staged --quiet; then
            echo "No changes in video_posts.csv to commit."
          else
            git commit -m "update: mark video post as Done"
            git push
          fi
